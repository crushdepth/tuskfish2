<?php declare(strict_types=1); ?>
<?php $summary = $viewModel->summary(); ?>
<?php $asset = TFISH_RANGEFINDER_ASSET_URL; ?>
<?php
// Species checkboxes are laid out as side-by-side columns rather than one tall scroll column, which
// dominated the panel height. Columns are filled in order up to this many entries each, so the
// leading columns are full and the last carries the remainder (13 rows -> 5 / 5 / 3). Rows read
// top-to-bottom, left-to-right, so a lineage's ploidy variants are not forced into one column.
$speciesPerColumn = 5;
?>

<!-- Client assets. In the body rather than the head because trust_path/ is outside the web root,
     so the module's own CSS/JS cannot ship beside its PHP, and putting them in a theme would mean
     editing a theme to install the module. A stylesheet link in the body is technically
     non-conforming but universally supported, and it buys installation with no core and no theme
     edit at all. Load order matters: Leaflet, then markercluster (which extends it), then ours. -->
<link rel="stylesheet" href="<?php echo xss($asset); ?>leaflet/leaflet.css">
<link rel="stylesheet" href="<?php echo xss($asset); ?>leaflet.markercluster/MarkerCluster.css">
<link rel="stylesheet" href="<?php echo xss($asset); ?>leaflet.markercluster/MarkerCluster.Default.css">
<link rel="stylesheet" href="<?php echo xss($asset); ?>rangefinder/rangefinder.css">

<!-- Container -->
<div class="container">
    <div class="row">
        <div class="col">
            <h1 class="page-title">
                <?php echo xss($viewModel->pageTitle()); ?>
            </h1>
        </div>
    </div>

    <div class="rangefinder-container">

        <!-- Headline counts: composition of the marker payload actually plotted. The three
             confidence buckets are counted separately and never summed into a single "records of
             species X" figure, because the two lead buckets make no verified species claim. A
             self-contained inline flex row rather than the theme grid, so the figures read as one
             compact strip instead of a tall stacked column. -->
        <ul class="rangefinder-summary">
            <li>
                <span class="rangefinder-count"><?php echo xss((string) ($summary['localities'] ?? 0)); ?></span>
                <span class="rangefinder-label"><?php echo xss(TFISH_RANGEFINDER_LOCALITIES); ?></span>
            </li>
            <li>
                <span class="rangefinder-count"><?php echo xss((string) ($summary['records'] ?? 0)); ?></span>
                <span class="rangefinder-label"><?php echo xss(TFISH_RANGEFINDER_RECORDS); ?></span>
            </li>
            <li>
                <span class="rangefinder-count"><?php echo xss((string) ($summary['verified'] ?? 0)); ?></span>
                <span class="rangefinder-label"><?php echo xss(TFISH_RANGEFINDER_VERIFIED); ?></span>
            </li>
            <li>
                <span class="rangefinder-count"><?php echo xss((string) ($summary['reported'] ?? 0)); ?></span>
                <span class="rangefinder-label"><?php echo xss(TFISH_RANGEFINDER_REPORTED); ?></span>
            </li>
            <li>
                <span class="rangefinder-count"><?php echo xss((string) ($summary['unidentified'] ?? 0)); ?></span>
                <span class="rangefinder-label"><?php echo xss(TFISH_RANGEFINDER_UNIDENTIFIED); ?></span>
            </li>
            <li>
                <span class="rangefinder-count"><?php echo xss((string) ($summary['countries'] ?? 0)); ?></span>
                <span class="rangefinder-label"><?php echo xss(TFISH_RANGEFINDER_COUNTRIES); ?></span>
            </li>
        </ul>

        <!-- Filters. All four compose with AND and run client-side against the payload below, so
             changing one costs no request. Every control is rendered here, in full: the species and
             country lists are derived from the loaded marker set and do not change after the page is
             built, so they are markup, not something JavaScript assembles from a shipped facet. The
             client reads which boxes are checked and nothing more. -->
        <div class="rangefinder-filters">
            <div class="rangefinder-filter-grid">

                <div class="rangefinder-filter">
                    <span class="rangefinder-filter-heading"><?php echo xss(TFISH_RANGEFINDER_CONFIDENCE); ?></span>
                    <label class="rangefinder-check">
                        <input type="checkbox" id="rangefinderVerified" checked>
                        <?php echo xss(TFISH_RANGEFINDER_VERIFIED); ?>
                    </label>
                    <label class="rangefinder-check">
                        <input type="checkbox" id="rangefinderReported" checked>
                        <?php echo xss(TFISH_RANGEFINDER_REPORTED); ?>
                    </label>
                    <label class="rangefinder-check">
                        <input type="checkbox" id="rangefinderUnidentified" checked>
                        <?php echo xss(TFISH_RANGEFINDER_UNIDENTIFIED); ?>
                    </label>
                </div>

                <div class="rangefinder-filter">
                    <label for="rangefinderCountry"><?php echo xss(TFISH_RANGEFINDER_COUNTRY); ?></label>
                    <!-- Mapped countries only, so a visitor cannot pick one and be shown an empty
                         map. The name is the one the source recorded where there is one, and the
                         ISO-3166 fallback only where there is not. -->
                    <select id="rangefinderCountry">
                        <option value=""><?php echo xss(TFISH_RANGEFINDER_ALL_COUNTRIES); ?></option>
                        <?php foreach ($viewModel->countryOptions() as $country): ?>
                            <option value="<?php echo xss($country['code']); ?>">
                                <?php echo xss($country['name'] . ' (' . $country['n_mapped'] . ')'); ?>
                            </option>
                        <?php endforeach; ?>
                    </select>
                </div>

                <div class="rangefinder-filter">
                    <label for="rangefinderHolding"><?php echo xss(TFISH_RANGEFINDER_HOLDING); ?></label>
                    <select id="rangefinderHolding">
                        <option value="any"><?php echo xss(TFISH_RANGEFINDER_HOLDING_ANY); ?></option>
                        <option value="obtainable"><?php echo xss(TFISH_RANGEFINDER_HOLDING_OBTAINABLE); ?></option>
                        <option value="live_cysts"><?php echo xss(TFISH_RANGEFINDER_HOLDING_LIVE_CYSTS); ?></option>
                        <option value="preserved_specimen"><?php echo xss(TFISH_RANGEFINDER_HOLDING_PRESERVED); ?></option>
                        <option value="tissue_or_dna"><?php echo xss(TFISH_RANGEFINDER_HOLDING_TISSUE); ?></option>
                        <option value="exhausted"><?php echo xss(TFISH_RANGEFINDER_HOLDING_EXHAUSTED); ?></option>
                    </select>
                </div>

            </div>

            <!-- Species / lineage sits on its own full-width row: with ~19 taxa a vertical scroll
                 column dominated the panel height, so the checkboxes are wrapped horizontally here
                 instead. -->
            <div class="rangefinder-filter rangefinder-species-filter">
                <span class="rangefinder-filter-heading"><?php echo xss(TFISH_RANGEFINDER_SPECIES_FILTER); ?></span>
                <!-- Every taxon that makes a species claim on the map — verified determinations and
                     accepted reported names alike — keyed on canonical_taxon, so citation variants of
                     a name collapse to one choice. Selecting one filters both its verified and its
                     reported records (a reported match stays a lead in colour and popup; see matches()
                     in rangefinder.js). Genus-only leads name no species and are not offered.
                     The checkbox value is the taxon key (canonical + ploidy), so the visible label is
                     free to be abbreviated without affecting selection or filtering. -->
                <div class="rangefinder-species-list" id="rangefinderSpecies">
                    <?php foreach (\array_chunk($viewModel->speciesFacet(), $speciesPerColumn) as $column): ?>
                        <div class="rangefinder-species-col">
                            <?php foreach ($column as $taxon): ?>
                                <label class="rangefinder-check">
                                    <input type="checkbox" value="<?php echo xss($taxon['key']); ?>">
                                    <span class="rangefinder-taxon"><?php echo xss($taxon['display_name']); ?></span>
                                    <?php if (!empty($taxon['ploidy'])): ?>
                                        <span class="rangefinder-tally"><?php echo xss($taxon['ploidy']); ?></span>
                                    <?php endif; ?>
                                    <span class="rangefinder-tally">
                                        <?php echo xss(\str_replace(
                                            '{mapped}',
                                            (string) $taxon['n_mapped'],
                                            TFISH_RANGEFINDER_MAPPED_TALLY
                                        )); ?>
                                    </span>
                                </label>
                            <?php endforeach; ?>
                        </div>
                    <?php endforeach; ?>
                </div>
            </div>

            <div class="rangefinder-actions">
                <button type="button" class="rangefinder-btn rangefinder-btn--accent" id="rangefinderReset">
                    <?php echo xss(TFISH_RANGEFINDER_RESET); ?>
                </button>
                <button type="button" class="rangefinder-btn" id="rangefinderGapMap" aria-pressed="false"
                        title="<?php echo xss(TFISH_RANGEFINDER_GAP_MAP_HELP); ?>">
                    <?php echo xss(TFISH_RANGEFINDER_GAP_MAP); ?>
                </button>
                <!-- Handoff to the table. A real link, not a button: its href is kept current by
                     writeUrl() in rangefinder.js, so it always carries the filters on screen, and it
                     middle-clicks into a new tab like a link should. With scripting off it still
                     works, carrying whatever state the page was loaded with.
                     This is also the map's only export affordance — the map streams no CSV of its own.
                     Filter here, cross to the table, download there: one export code path, and the
                     map keeps no server surface. The base URL is passed as data rather than built in
                     JavaScript, so nothing client-side knows the site's URL structure. -->
                <a class="rangefinder-btn" id="rangefinderTableLink"
                   data-base="<?php echo xss(TFISH_URL . 'explore/'); ?>"
                   href="<?php echo xss(TFISH_URL . 'explore/'); ?>"
                   title="<?php echo xss(TFISH_RANGEFINDER_VIEW_AS_TABLE_HELP); ?>">
                    <?php echo xss(TFISH_RANGEFINDER_VIEW_AS_TABLE); ?>
                </a>
                <span class="rangefinder-plotted" id="rangefinderPlotted"></span>
            </div>
        </div>

        <!-- Map canvas. -->
        <div id="rangefinderMap" class="rangefinder-map"></div>

        <!-- Legend. Deliberately part of the page rather than a Leaflet control, so it is always
             visible and cannot be collapsed away. -->
        <div class="rangefinder-legend">
            <span class="rangefinder-legend-item">
                <span class="rangefinder-swatch rangefinder-swatch-species"></span>
                <?php echo xss(TFISH_RANGEFINDER_LEGEND_SPECIES); ?>
            </span>
            <span class="rangefinder-legend-item">
                <span class="rangefinder-swatch rangefinder-swatch-presence"></span>
                <?php echo xss(TFISH_RANGEFINDER_LEGEND_PRESENCE); ?>
            </span>
            <span class="rangefinder-legend-item">
                <span class="rangefinder-swatch rangefinder-swatch-both"></span>
                <?php echo xss(TFISH_RANGEFINDER_LEGEND_BOTH); ?>
            </span>
            <!-- Both notes in one wrapper: they are a single block of prose, and the wrapper is the
                 flex item that gives the block its own full-width line under the swatches. -->
            <div class="rangefinder-legend-notes">
                <p class="rangefinder-legend-note">
                    <strong><?php echo xss(TFISH_RANGEFINDER_LEGEND_NOTE_VERIFIED_TERM); ?></strong>
                    <?php echo xss(TFISH_RANGEFINDER_LEGEND_NOTE_VERIFIED); ?>
                </p>
                <p class="rangefinder-legend-note">
                    <strong><?php echo xss(TFISH_RANGEFINDER_LEGEND_NOTE_UNVERIFIED_TERM); ?></strong>
                    <?php echo xss(TFISH_RANGEFINDER_LEGEND_NOTE_UNVERIFIED); ?>
                </p>
            </div>
        </div>

        <?php if (empty($summary['records'])): ?>
            <p class="rangefinder-empty"><?php echo xss(TFISH_RANGEFINDER_DB_UNAVAILABLE); ?></p>
        <?php endif; ?>

    </div>
</div>

<!-- Payload for the client-side map. Only what is read at interaction time ships: the markers to
     plot and filter, with their record-level detail inline (D-20), and the per-country bounding
     boxes used to reframe a selection that plots nothing. The facets behind the filter controls are
     not here — they are rendered as markup above, because they never change after this page is
     built. All of it is JSON_HEX_* escaped server-side, so none of it can break out of this script
     block. -->
<script>
    window.rangefinder = window.rangefinder || {};
    window.rangefinder.markers = <?php echo $viewModel->markersJson(); ?>;
    window.rangefinder.countryBounds = <?php echo $viewModel->countryBoundsJson(); ?>;
    window.rangefinder.tileProvider = <?php echo $viewModel->tileProviderJson(); ?>;
    window.rangefinder.maxZoom = <?php echo (int) $viewModel->maxZoom(); ?>;
    window.rangefinder.strings = {
        unnamedLocality: <?php echo \json_encode(TFISH_RANGEFINDER_UNNAMED_LOCALITY); ?>,
        unverified: <?php echo \json_encode(TFISH_RANGEFINDER_UNVERIFIED); ?>,
        genusOnly: <?php echo \json_encode(TFISH_RANGEFINDER_GENUS_ONLY); ?>,
        verifiedHeading: <?php echo \json_encode(TFISH_RANGEFINDER_VERIFIED); ?>,
        reportedHeading: <?php echo \json_encode(TFISH_RANGEFINDER_REPORTED); ?>,
        unidentifiedHeading: <?php echo \json_encode(TFISH_RANGEFINDER_UNIDENTIFIED); ?>,
        recordTally: <?php echo \json_encode(TFISH_RANGEFINDER_RECORD_TALLY); ?>,
        recordedBy: <?php echo \json_encode(TFISH_RANGEFINDER_RECORDED_BY); ?>,
        dateUnknown: <?php echo \json_encode(TFISH_RANGEFINDER_DATE_UNKNOWN); ?>,
        accessionLabel: <?php echo \json_encode(TFISH_RANGEFINDER_ACCESSION); ?>,
        viewRecord: <?php echo \json_encode(TFISH_RANGEFINDER_VIEW_RECORD); ?>,
        moreRecords: <?php echo \json_encode(TFISH_RANGEFINDER_MORE_RECORDS); ?>,
        viewAsTable: <?php echo \json_encode(TFISH_RANGEFINDER_VIEW_AS_TABLE); ?>,
        fewerRecords: <?php echo \json_encode(TFISH_RANGEFINDER_FEWER_RECORDS); ?>,
        materialLabels: {
            live_cysts: <?php echo \json_encode(TFISH_RANGEFINDER_HOLDING_LIVE_CYSTS); ?>,
            preserved_specimen: <?php echo \json_encode(TFISH_RANGEFINDER_HOLDING_PRESERVED); ?>,
            tissue_or_dna: <?php echo \json_encode(TFISH_RANGEFINDER_HOLDING_TISSUE); ?>,
            exhausted: <?php echo \json_encode(TFISH_RANGEFINDER_HOLDING_EXHAUSTED); ?>
        },
        showing: <?php echo \json_encode(TFISH_RANGEFINDER_SHOWING); ?>,
        accuracyM: <?php echo \json_encode(TFISH_RANGEFINDER_ACCURACY_M); ?>,
        accuracyKm: <?php echo \json_encode(TFISH_RANGEFINDER_ACCURACY_KM); ?>,
        accuracyShow: <?php echo \json_encode(TFISH_RANGEFINDER_ACCURACY_SHOW); ?>,
        accuracyHide: <?php echo \json_encode(TFISH_RANGEFINDER_ACCURACY_HIDE); ?>,
        dataAttribution: <?php echo \json_encode(TFISH_RANGEFINDER_DATA_ATTRIBUTION); ?>,
        noTileProvider: <?php echo \json_encode(TFISH_RANGEFINDER_NO_TILE_PROVIDER); ?>,
        fullscreen: <?php echo \json_encode(TFISH_RANGEFINDER_FULLSCREEN); ?>,
        exitFullscreen: <?php echo \json_encode(TFISH_RANGEFINDER_EXIT_FULLSCREEN); ?>
    };
</script>
<script src="<?php echo xss($asset); ?>leaflet/leaflet.js"></script>
<script src="<?php echo xss($asset); ?>leaflet.markercluster/leaflet.markercluster.js"></script>
<script src="<?php echo xss($asset); ?>rangefinder/rangefinder.js"></script>
